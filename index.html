<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b32">
<title>3D Research Marine Robotics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --fondo:#102b32; --testo:#fff; --tenue:#d5e2e5; --linea:#a9c0c6; --accento:#8fe0d8; --errore:#ffb4a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fondo); }
  body { color: var(--testo); font-family: Barlow, Arial, sans-serif; min-height: 100dvh; }
  .logo { background: #fff; padding: 12px 24px; display: flex; justify-content: center; }
  .logo img { display: block; height: 52px; width: auto; }
  main { max-width: 440px; margin: 0 auto; padding: 22px 24px 28px; display: flex; flex-direction: column; min-height: calc(100dvh - 76px); }
  .testata { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; margin-top: -12px; }
  .evento { color: var(--linea); font-size: 14px; font-weight: 500; }
  #cambia-lingua { font-size: 14px; font-weight: 500; padding: 12px 0 12px 12px; }
  h1 { font-family: 'Barlow Condensed', Arial, sans-serif; font-weight: 600; font-size: clamp(52px, 16vw, 64px); line-height: .95; margin: 18px 0 12px; }
  h1 em { color: var(--accento); }
  p { font-size: 16px; line-height: 1.4; color: var(--tenue); margin: 0 0 22px; }
  form { display: flex; flex-direction: column; gap: 20px; flex: 1; }
  label.campo { display: block; font-size: 13px; font-weight: 600; color: var(--linea); text-transform: uppercase; }
  input[type=text], input[type=email] { width: 100%; height: 44px; border: 0; border-bottom: 1px solid var(--linea); border-radius: 0; background: transparent; color: var(--testo); padding: 0; font: inherit; font-size: 18px; outline: 0; text-transform: none; }
  input:focus { border-bottom: 2px solid var(--accento); }
  .consenso { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.35; color: var(--tenue); }
  .consenso input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--accento); }
  a { color: var(--accento); }
  .azione { min-height: 52px; width: 100%; margin-top: auto; border: 0; border-radius: 0; background: var(--accento); color: var(--fondo); font: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; cursor: pointer; text-decoration: none; }
  .azione:disabled { opacity: .6; cursor: default; }
  .errore { color: var(--errore); font-size: 14px; line-height: 1.35; margin: 0; min-height: 0; }
  .esca { position: absolute; left: -9999px; }
  .recapito { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 58px; border-top: 1px solid var(--linea); color: var(--testo); font-size: 16px; font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
  .recapiti { border-bottom: 1px solid var(--linea); margin-bottom: 24px; }
  .azienda { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="logo"><img src="logo.png" alt="3D Research Marine Robotics"></div>
<main>
  <div class="testata"><div class="evento" id="evento"></div><a id="cambia-lingua" lang="" hreflang=""></a></div>

  <section id="vista-modulo" style="display:flex;flex-direction:column;flex:1">
    <h1 id="titolo"></h1>
    <p id="intro"></p>
    <form id="modulo" novalidate>
      <div><label class="campo" for="nome" id="l-nome"></label><input id="nome" type="text" autocomplete="given-name" required></div>
      <div><label class="campo" for="cognome" id="l-cognome"></label><input id="cognome" type="text" autocomplete="family-name" required></div>
      <div><label class="campo" for="email" id="l-email"></label><input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" required></div>
      <div class="esca" aria-hidden="true"><label for="sito_web">Sito</label><input id="sito_web" type="text" tabindex="-1" autocomplete="off"></div>
      <label class="consenso"><input id="consenso" type="checkbox" required><span><span id="t-consenso"></span> <a id="privacy" target="_blank" rel="noopener" hidden></a></span></label>
      <p class="errore" id="errore" role="alert" hidden></p>
      <button class="azione" id="invia" type="submit"><span id="t-invia"></span><span aria-hidden="true">↗</span></button>
    </form>
  </section>

  <section id="vista-conferma" style="flex-direction:column;flex:1" hidden>
    <h1 id="titolo-grazie"></h1>
    <p id="grazie"></p>
    <div class="azienda" id="azienda"></div>
    <div class="recapiti" id="recapiti"></div>
    <a class="azione" id="catalogo" target="_blank" rel="noopener" hidden><span id="t-catalogo"></span><span aria-hidden="true">↓</span></a>
  </section>
</main>

<script>
  // Indirizzo dello script Google, da inserire dopo la pubblicazione.
  var INDIRIZZO_SCRIPT = 'https://script.google.com/macros/s/AKfycbw9EwDpXrRv4rpbNIcNZy_byErvIJtxkZlLpcvkC9TXH5F1Evgwxmae1iSKGfRvnPnt/exec';

  var TESTI = {
    it: {
      titolo: 'RESTIAMO IN <em>CONTATTO</em>', intro: 'Lascia i tuoi dati: subito dopo trovi i nostri recapiti.',
      nome: 'Nome', cognome: 'Cognome', email: 'Email',
      consenso: 'Accetto di essere ricontattato per possibili collaborazioni.', privacy: 'Informativa privacy',
      invia: 'Invia', attendere: 'Invio in corso…',
      titoloGrazie: 'GRAZIE DELLA <em>VISITA</em>', grazie: 'Abbiamo i tuoi dati e ti scriveremo dopo la fiera. Ecco come raggiungerci:',
      catalogo: 'Scarica il catalogo 2026',
      erroreCampi: 'Compila nome, cognome e un indirizzo email valido, poi accetta il consenso.',
      erroreRete: 'Invio non riuscito. Controlla la connessione e riprova.'
    },
    en: {
      titolo: 'LET’S STAY IN <em>TOUCH</em>', intro: 'Leave your details and you’ll find our contacts right after.',
      nome: 'First name', cognome: 'Last name', email: 'Email',
      consenso: 'I agree to be contacted about possible collaborations.', privacy: 'Privacy notice',
      invia: 'Send', attendere: 'Sending…',
      titoloGrazie: 'THANKS FOR <em>VISITING</em>', grazie: 'We have your details and will write to you after the show. Here’s how to reach us:',
      catalogo: 'Download the 2026 catalog',
      erroreCampi: 'Enter your first name, last name and a valid email, then tick the consent box.',
      erroreRete: 'Sending failed. Check your connection and try again.'
    }
  };

  var parametri = new URLSearchParams(location.search);
  // Inglese predefinito: italiano solo se browser e sistema indicano entrambi l'italiano.
  function linguaItaliana(valore) {
    return String(valore || '').toLowerCase().indexOf('it') === 0;
  }
  var linguaSistema = '';
  try { linguaSistema = Intl.DateTimeFormat().resolvedOptions().locale; } catch (e) {}
  var lingua = parametri.get('lang') ||
    (linguaItaliana(navigator.language) && linguaItaliana(linguaSistema) ? 'it' : 'en');
  if (!TESTI[lingua]) lingua = 'en';

  var altraLingua = lingua === 'it' ? 'en' : 'it';
  var parametriCambio = new URLSearchParams(location.search);
  parametriCambio.set('lang', altraLingua);
  document.getElementById('cambia-lingua').href = '?' + parametriCambio.toString();
  document.getElementById('cambia-lingua').textContent = altraLingua === 'it' ? 'Italiano' : 'English';
  var t = TESTI[lingua];
  var codiceFiera = parametri.get('fiera') || '';
  var el = function (id) { return document.getElementById(id); };

  document.documentElement.lang = lingua;
  el('titolo').innerHTML = t.titolo;
  el('titolo-grazie').innerHTML = t.titoloGrazie;
  el('intro').textContent = t.intro;
  el('grazie').textContent = t.grazie;
  el('l-nome').textContent = t.nome;
  el('l-cognome').textContent = t.cognome;
  el('l-email').textContent = t.email;
  el('t-consenso').textContent = t.consenso;
  el('t-invia').textContent = t.invia;
  el('t-catalogo').textContent = t.catalogo;

  function indirizzoSicuro(valore) {
    return /^https?:\/\//i.test(valore) ? valore : '';
  }

  function aggiungiRecapito(testo, href) {
    var a = document.createElement('a');
    a.className = 'recapito';
    a.href = href;
    if (/^http/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
    var s = document.createElement('span');
    s.textContent = testo;
    var f = document.createElement('span');
    f.textContent = '↗';
    f.setAttribute('aria-hidden', 'true');
    a.appendChild(s);
    a.appendChild(f);
    el('recapiti').appendChild(a);
  }

  function applicaImpostazioni(dati) {
    var i = dati.impostazioni || {};
    el('evento').textContent = dati.fiera || '';
    el('azienda').textContent = i.nome || '';
    el('recapiti').textContent = '';
    if (i.email) aggiungiRecapito(i.email, 'mailto:' + i.email);
    if (i.telefono) aggiungiRecapito(i.telefono, 'tel:' + i.telefono.replace(/[^+0-9]/g, ''));
    if (indirizzoSicuro(i.sito)) aggiungiRecapito(i.sito.replace(/^https?:\/\/|\/$/g, ''), i.sito);
    if (indirizzoSicuro(i.linkedin)) aggiungiRecapito('LinkedIn', i.linkedin);
    if (indirizzoSicuro(i.catalogo)) { el('catalogo').href = i.catalogo; el('catalogo').hidden = false; }
    if (indirizzoSicuro(i.privacy)) {
      el('privacy').href = i.privacy;
      el('privacy').textContent = t.privacy;
      el('privacy').hidden = false;
    }
  }

  fetch(INDIRIZZO_SCRIPT + '?fiera=' + encodeURIComponent(codiceFiera))
    .then(function (r) { return r.json(); })
    .then(applicaImpostazioni)
    .catch(function () { /* il modulo resta utilizzabile; riprova all'invio */ });

  el('modulo').addEventListener('input', function () { el('errore').hidden = true; });

  el('modulo').addEventListener('submit', function (evento) {
    evento.preventDefault();
    var errore = el('errore');
    errore.hidden = true;
    var emailValida = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el('email').value.trim());
    if (!el('nome').value.trim() || !el('cognome').value.trim() || !emailValida || !el('consenso').checked) {
      errore.textContent = t.erroreCampi;
      errore.hidden = false;
      return;
    }
    var bottone = el('invia');
    bottone.disabled = true;
    el('t-invia').textContent = t.attendere;
    fetch(INDIRIZZO_SCRIPT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        fiera: codiceFiera,
        nome: el('nome').value,
        cognome: el('cognome').value,
        email: el('email').value,
        consenso: el('consenso').checked,
        lingua: lingua,
        sito_web: el('sito_web').value
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (risposta) {
        if (!risposta.ok) throw new Error('rifiutato');
        el('vista-modulo').hidden = true;
        el('vista-conferma').hidden = false;
        el('vista-conferma').style.display = 'flex';
        window.scrollTo(0, 0);
      })
      .catch(function () {
        errore.textContent = t.erroreRete;
        errore.hidden = false;
        bottone.disabled = false;
        el('t-invia').textContent = t.invia;
      });
  });
</script>
</body>
</html>
